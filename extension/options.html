<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PC Guardian · 设置</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    max-width: 800px; margin: 40px auto; padding: 0 20px; color: #1f2937; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 24px; }
  textarea { width: 100%; min-height: 280px; padding: 10px; font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; border: 1px solid #d1d5db; border-radius: 4px; }
  .row { display: flex; gap: 12px; margin-top: 12px; }
  button { padding: 8px 16px; border: 1px solid #2563eb; background: #2563eb; color: white;
    border-radius: 4px; cursor: pointer; font-size: 14px; }
  button.secondary { background: white; color: #2563eb; }
  button:hover { opacity: 0.9; }
  .stats { background: #f3f4f6; padding: 12px; border-radius: 4px; margin-bottom: 16px;
    font-size: 13px; color: #4b5563; line-height: 1.8; }
  .diag { border: 1px solid #e5e7eb; border-radius: 6px; padding: 14px 16px; margin-bottom: 24px; }
  .diag h3 { margin: 0 0 6px; font-size: 15px; }
  .diag .hint { color: #6b7280; font-size: 12px; margin-bottom: 10px; }
  .diag table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  .diag td { padding: 5px 6px; border-bottom: 1px solid #f0f0f0; }
  .ok { color: #15803d; font-weight: 600; }
  .bad { color: #dc2626; font-weight: 600; }
  code { background: #f3f4f6; padding: 1px 5px; border-radius: 3px; font-size: 12px; }

  /* ---- Tabs (P2-2) ---- */
  .tabs { display: flex; gap: 0; border-bottom: 2px solid #e5e7eb; margin-bottom: 18px; }
  .tab-btn { padding: 8px 18px; border: none; background: transparent; color: #6b7280;
    cursor: pointer; font-size: 14px; font-weight: 500; border-bottom: 3px solid transparent;
    margin-bottom: -2px; border-radius: 0; }
  .tab-btn:hover { color: #2563eb; opacity: 1; }
  .tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* ---- Alerts pane (P2-2) ---- */
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
  .chip { padding: 4px 12px; border: 1px solid #d1d5db; border-radius: 999px; cursor: pointer;
    font-size: 12px; color: #4b5563; background: white; user-select: none; }
  .chip:hover { border-color: #2563eb; color: #2563eb; }
  .chip.active { background: #2563eb; color: white; border-color: #2563eb; }
  .chip-label { font-size: 12px; color: #6b7280; margin-right: 4px; }
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px; margin-bottom: 18px; }
  .summary-card { padding: 14px 16px; border: 1px solid #e5e7eb; border-radius: 6px;
    background: #f9fafb; }
  .summary-card .label { font-size: 12px; color: #6b7280; }
  .summary-card .value { font-size: 22px; font-weight: 700; color: #1f2937; margin-top: 4px; }
  .rule-list { padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 6px;
    margin-bottom: 18px; background: white; }
  .rule-list h4 { margin: 0 0 8px; font-size: 13px; color: #6b7280; }
  .rule-list ul { list-style: none; padding: 0; margin: 0; }
  .rule-list li { display: flex; justify-content: space-between; padding: 4px 0;
    font-size: 13px; border-bottom: 1px solid #f0f0f0; }
  .rule-list li:last-child { border-bottom: none; }
  .rule-list .rule-name { font-family: ui-monospace, Consolas, monospace; color: #4b5563; }
  .rule-list .rule-count { color: #2563eb; font-weight: 600; }
  .alert-item { border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 8px;
    background: white; overflow: hidden; }
  .alert-head { padding: 10px 14px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
  .alert-head:hover { background: #f9fafb; }
  .alert-type { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600;
    flex-shrink: 0; }
  .alert-type-url { background: #dbeafe; color: #1e40af; }
  .alert-type-proc { background: #fed7aa; color: #9a3412; }
  .alert-type-quarantine { background: #fee2e2; color: #991b1b; }
  .alert-rule { font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    color: #6b7280; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .alert-ts { font-size: 12px; color: #9ca3af; flex-shrink: 0; }
  .alert-detail { padding: 0 14px 12px; font-size: 13px; color: #4b5563;
    border-top: 1px solid #f0f0f0; padding-top: 10px; word-break: break-all; }
  .alert-detail .ev { display: block; padding: 2px 0; }
  .empty-state { padding: 24px; text-align: center; color: #9ca3af; font-size: 13px;
    border: 1px dashed #e5e7eb; border-radius: 6px; }
</style>
</head>
<body>
  <div class="diag">
    <h3>安装自检</h3>
    <div class="hint">装完 / 改完后先点这个按钮。若结果里有 ✗，说明 Edge 里加载的还是旧代码，请到 <code>edge://extensions</code> 点"重新加载"。</div>
    <div class="stats" id="stats">加载中…</div>
    <button id="selftest" class="secondary" type="button">运行自检</button>
    <div id="selftest-result"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="whitelist" type="button">白名单 / 灰名单</button>
    <button class="tab-btn" data-tab="alerts" type="button">告警历史</button>
  </div>

  <!-- Tab 1: 白名单 / 灰名单 -->
  <div class="tab-pane active" id="tab-whitelist">
    <h1>PC Guardian · 白名单与灰名单</h1>
    <p class="sub">每行一个 URL 或域名（域名会自动补 https://）。保存后同步到本地后台服务。</p>

    <h3>白名单</h3>
    <textarea id="whitelist" placeholder="https://www.example.com/"></textarea>

    <h3>灰名单</h3>
    <textarea id="grayscale" placeholder="*.tk"></textarea>

    <div class="row">
      <button id="save">保存并生效</button>
      <button id="reload" class="secondary">从后台重新拉取</button>
    </div>
  </div>

  <!-- Tab 2: 告警历史 (P2-2) -->
  <div class="tab-pane" id="tab-alerts">
    <h1>告警历史</h1>
    <p class="sub">所有命中拦截的事件（URL / 进程 / 文件）。每 30 秒自动刷新；点击单条展开看证据。</p>

    <div class="chip-row">
      <span class="chip-label">时间范围：</span>
      <span class="chip active" data-since="24h">24 小时</span>
      <span class="chip" data-since="7d">7 天</span>
      <span class="chip" data-since="30d">30 天</span>
      <span class="chip" data-since="all">全部</span>
      <span style="flex:1"></span>
      <button class="secondary" id="alerts-refresh" type="button" style="padding:4px 12px;font-size:12px">手动刷新</button>
    </div>

    <div class="chip-row">
      <span class="chip-label">事件类型：</span>
      <span class="chip active" data-type="all">全部</span>
      <span class="chip" data-type="url">URL 拦截</span>
      <span class="chip" data-type="proc">进程告警</span>
      <span class="chip" data-type="quarantine">文件隔离</span>
    </div>

    <div id="alerts-summary"></div>
    <div id="alerts-list"></div>
  </div>

<script src="options.js"></script>
<script src="alerts.js"></script>
</body>
</html>
